name: CI
on:
  push:
    branches: ["claude/**", "nightly/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLATFORM_FEE_BPS: "500"
      SALES_TAX_GEO_LOOKUP: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run tests/unit
      - run: npm run build
