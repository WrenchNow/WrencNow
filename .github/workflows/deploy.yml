# Pantry Pal: build, check and deploy on every push to main (or tap "Run workflow" in the Actions tab).
#
# It never fails just because a secret isn't set yet. Each deploy step skips with a clear log line,
# so the first pushes stay green while Wyatt adds secrets one at a time.
#
# Secrets (GitHub → Settings → Secrets and variables → Actions → Secrets):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   deploy the Worker (free AI backend)
#   ANTHROPIC_API_KEY                             optional; pushed to the Worker as a secret when set
#   NETLIFY_AUTH_TOKEN                            deploy the app + recipe site
#   NETLIFY_SITE_ID                               optional if the NETLIFY_SITE_NAME variable is set
# Variables (same page → Variables tab), all optional:
#   NETLIFY_SITE_NAME   e.g. pantry-pal-wyatt. Finds that Netlify project, or creates it (new, empty) the first time
#   SITE_URL            the public address once you have a domain, e.g. https://pantrypal.app
#   ALLOWED_ORIGIN      overrides the automatic one (the Netlify address + custom domain)
#   FREE_DAILY_PER_USER / FREE_DAILY_TOTAL   free AI caps (default 8 / 300)
#   BACKEND_URL         Worker address to use when the Worker isn't deployed by this workflow
#
# Full guide: docs/setup/RUNBOOK.md

name: Build and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'marketing/**'
      - '.claude/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pantry-pal-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER_VERSION: 4.148.0      # published 2026-10-06
      NETLIFY_CLI_VERSION: 27.11.2   # published 2026-10-06
      FORCE_COLOR: '1'
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (2026-07-17)

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0 (2026-07-13)
        with:
          node-version: '22'

      - name: See which secrets are set
        id: have
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NL_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NL_SITE: ${{ secrets.NETLIFY_SITE_ID }}
          NL_NAME: ${{ vars.NETLIFY_SITE_NAME }}
        run: |
          cf=false; nl=false
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then cf=true; fi
          if [ -n "$NL_TOKEN" ] && { [ -n "$NL_SITE" ] || [ -n "$NL_NAME" ]; }; then nl=true; fi
          echo "cloudflare=$cf" >> "$GITHUB_OUTPUT"
          echo "netlify=$nl" >> "$GITHUB_OUTPUT"
          {
            echo "## What this run can do"
            echo ""
            if [ "$cf" = true ]; then echo "- ✅ Cloudflare secrets set: the Worker will deploy"; else echo "- ⏭️ Worker deploy skipped: add secrets **CLOUDFLARE_API_TOKEN** and **CLOUDFLARE_ACCOUNT_ID**"; fi
            if [ -n "$AI_KEY" ]; then echo "- ✅ ANTHROPIC_API_KEY set: it goes to the Worker as a hidden secret"; else echo "- ⏭️ No ANTHROPIC_API_KEY secret: free AI stays off until it's added (or until it's saved on the Worker another way)"; fi
            if [ "$nl" = true ]; then echo "- ✅ Netlify set: the app and recipe site will deploy"; else echo "- ⏭️ Netlify deploy skipped: add secret **NETLIFY_AUTH_TOKEN** plus variable **NETLIFY_SITE_NAME** (or secret NETLIFY_SITE_ID)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$cf" = true ] || echo "::notice::Skipping the Worker deploy: CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID secrets are not set."
          [ "$nl" = true ] || echo "::notice::Skipping the Netlify deploy: NETLIFY_AUTH_TOKEN secret and NETLIFY_SITE_NAME variable (or NETLIFY_SITE_ID secret) are not set."
          [ -n "$AI_KEY" ] || echo "::notice::ANTHROPIC_API_KEY secret is not set; the Worker keeps whatever key it already has (none on a first deploy)."

      - name: Build the app from src/ and check pantry-pal.html was committed up to date
        run: |
          python3 build.py
          if ! git diff --quiet -- pantry-pal.html; then
            echo "::error::pantry-pal.html doesn't match src/. Run 'python3 build.py' and commit pantry-pal.html."
            git diff --stat -- pantry-pal.html
            exit 1
          fi
          echo "pantry-pal.html is up to date."

      - name: Syntax-check the Worker and scripts
        run: |
          node --check pantry-pal-worker/src/index.js
          node --check pantry-pal-worker/deploy.mjs
          node --check build-site.js
          node --check scripts/check-setup.mjs
          node --check scripts/ci/netlify-site.mjs
          echo "All scripts parse."

      - name: Find the Pantry Pal project on Netlify (refuses any non-Pantry Pal project)
        id: netlify
        if: steps.have.outputs.netlify == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_SITE_NAME: ${{ vars.NETLIFY_SITE_NAME }}
        run: node scripts/ci/netlify-site.mjs

      - name: Deploy the Worker (Cloudflare)
        if: steps.have.outputs.cloudflare == 'true'
        working-directory: pantry-pal-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN || steps.netlify.outputs.origins }}
          FREE_DAILY_PER_USER: ${{ vars.FREE_DAILY_PER_USER }}
          FREE_DAILY_TOTAL: ${{ vars.FREE_DAILY_TOTAL }}
          DEPLOY_NONINTERACTIVE: '1'
        run: |
          # deploy.mjs needs its non-interactive mode (docs/setup/RUNBOOK.md, Appendix A). Without it,
          # it would wait for a browser sign-in or a typed key, so skip instead of hanging.
          if ! grep -q 'DEPLOY_NONINTERACTIVE' deploy.mjs; then
            echo "::warning::Skipping the Worker deploy: deploy.mjs has no CI mode yet. Apply RUNBOOK Appendix A (product-dev)."
            exit 0
          fi
          export WRANGLER_CMD="npx --yes wrangler@${WRANGLER_VERSION}"
          node deploy.mjs
          # deploy.mjs wrote the Worker address into src/app.js and rebuilt pantry-pal.html in this run.
          url=$(grep -oE "BACKEND_URL:[[:space:]]*'[^']*'" ../src/app.js | sed -E "s/.*'([^']*)'/\1/")
          echo "### Worker: $url" >> "$GITHUB_STEP_SUMMARY"
          if ! git diff --quiet -- ../src/app.js; then
            echo "::notice::The Worker address ($url) was added to this deploy only. Ask Claude to commit BACKEND_URL: '$url' in src/app.js so it stays."
          fi

      - name: Use the saved Worker address (if this run didn't deploy one)
        env:
          SAVED_BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          current=$(grep -oE "BACKEND_URL:[[:space:]]*'[^']*'" src/app.js | sed -E "s/.*'([^']*)'/\1/")
          if [ -n "$current" ]; then echo "BACKEND_URL is $current"; exit 0; fi
          if [ -z "$SAVED_BACKEND_URL" ]; then echo "::notice::No Worker address yet. The app will deploy without free AI (users can still add their own key)."; exit 0; fi
          case "$SAVED_BACKEND_URL" in https://*) ;; *) echo "::error::The BACKEND_URL variable must start with https://"; exit 1;; esac
          sed -i -E "s|(BACKEND_URL:[[:space:]]*)'[^']*'|\1'${SAVED_BACKEND_URL%/}'|" src/app.js
          python3 build.py
          echo "Using BACKEND_URL from the repo variable: $SAVED_BACKEND_URL"

      - name: Build the recipe website
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.netlify.outputs.site_url || 'https://YOUR-DOMAIN.com' }}
        run: node build-site.js "$SITE_URL"

      - name: Deploy the app + recipe site (Netlify)
        if: steps.netlify.outputs.ready == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SITE_ID: ${{ steps.netlify.outputs.site_id }}
          LIVE_URL: ${{ steps.netlify.outputs.site_url }}
        run: |
          npx --yes "netlify-cli@${NETLIFY_CLI_VERSION}" deploy --prod --no-build --dir=site \
            --site="$SITE_ID" --message="GitHub ${GITHUB_SHA::7}: ${GITHUB_EVENT_NAME}"
          echo "### Live: $LIVE_URL (app at /app/)" >> "$GITHUB_STEP_SUMMARY"

      - name: Health check (read-only)
        continue-on-error: true
        env:
          SITE_URL: ${{ steps.netlify.outputs.ready == 'true' && (vars.SITE_URL || steps.netlify.outputs.site_url) || '' }}
        run: |
          if [ -n "$SITE_URL" ]; then node scripts/check-setup.mjs --site "$SITE_URL"; else node scripts/check-setup.mjs; fi
