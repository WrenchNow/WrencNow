<style>
:root{
  --bg:#FAF6EF;--surface:#FFFFFF;--surface-2:#F2ECE1;--ink:#1E2721;--muted:#636A63;--line:#E6DED0;
  --brand:#2E6A4E;--brand-2:#3F8562;--brand-ink:#FFFFFF;--brand-soft:#E3EFE7;
  /* --accent: UI tomato for text and buttons (AA on cream/white). --tomato: brand tomato, only for the icon, illustrations and text >=24px. */
  --accent:#B3431F;--accent-soft:#FBE6DE;--on-accent:#FFFFFF;--tomato:#D9572F;--warn:#8C5A06;--warn-soft:#FBEFD3;
  --danger:#B23624;--danger-soft:#F8E0DA;--ok:#2E7D4F;
  --shadow:0 1px 2px rgba(30,39,33,.06),0 6px 20px rgba(30,39,33,.07);
  --radius:18px;--radius-sm:12px;
  --font-d:'Fraunces',Georgia,'Times New Roman',serif;--font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --art-s:58%;--art-l:87%;--nav-h:66px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111613;--surface:#19201B;--surface-2:#222B25;--ink:#ECEFEA;--muted:#9BA49C;--line:#2D3731;
  --brand:#67BC8F;--brand-2:#80CBA2;--brand-ink:#0D1510;--brand-soft:#1E3327;
  --accent:#F08A64;--accent-soft:#3B241B;--on-accent:#1E2721;--warn:#E8B655;--warn-soft:#3A2F15;
  --danger:#F28472;--danger-soft:#3E201B;--ok:#71CC97;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.28);--art-s:32%;--art-l:24%;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
h1,h2,h3{font-family:var(--font-d);font-weight:700;letter-spacing:-.01em;margin:0}
h1{font-size:30px;line-height:1.1}
h2{font-size:20px;line-height:1.2}
h3{font-size:17px;line-height:1.25}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}

#app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 28px)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:2px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-width:44px;height:44px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 16px;font-weight:600;font-size:15px;min-height:48px;text-decoration:none;transition:transform .08s ease,filter .15s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-accent{background:var(--accent);color:var(--on-accent)}
.btn-soft{background:var(--brand-soft);color:var(--brand)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-sm{min-height:44px;padding:7px 12px;border-radius:10px;font-size:14px}
.btn-block{width:100%}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.grow{flex:1}

/* segmented + chips */
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{min-height:44px;flex:1;border:0;background:transparent;border-radius:10px;padding:9px 8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500;white-space:nowrap;min-height:44px}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip.danger.on{background:var(--danger);border-color:var(--danger);color:var(--on-accent)}
.chip .x{margin-left:6px;opacity:.7}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label,.label{font-size:13px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px;min-height:46px;outline:none}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.input{min-height:110px;resize:vertical;line-height:1.45}
.search{position:relative}
.search .input{padding-left:40px}
.search::before{content:'⌕';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.stepper button{border:0;background:transparent;width:44px;height:44px;font-size:20px;font-weight:600;color:var(--brand)}
.stepper span{min-width:44px;text-align:center;font-weight:700}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.toggle{appearance:none;-webkit-appearance:none;width:48px;height:28px;padding:8px 0;box-sizing:content-box;background-clip:content-box;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s;cursor:pointer}
.toggle::after{content:'';position:absolute;top:11px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.toggle:checked{background:var(--brand)}
.toggle:checked::after{transform:translateX(20px)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.panel h2{margin-bottom:10px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px}
.section-h h2{font-size:19px}
.count{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 7px;border-radius:999px;background:var(--surface-2);font:600 12px var(--font);color:var(--muted);margin-left:6px;vertical-align:middle}
.note{background:var(--surface-2);border-radius:var(--radius-sm);padding:12px 14px;font-size:14px;color:var(--muted)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.danger{background:var(--danger-soft);color:var(--danger)}
.note.ok{background:var(--brand-soft);color:var(--brand)}
.disclosure{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.4}

/* filters */
details.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px}
details.filters summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-weight:600;cursor:pointer}
details.filters summary::-webkit-details-marker{display:none}
details.filters summary::after{content:'▾';color:var(--muted);transition:transform .2s}
details.filters[open] summary::after{transform:rotate(180deg)}
.filters-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.filters-body .label{margin-bottom:6px;display:block}

/* recipe cards */
.feed{display:flex;flex-direction:column;gap:12px}
.card{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%}
.card:active{transform:scale(.995)}
.art{flex:none;width:84px;height:84px;border-radius:14px;display:grid;place-items:center;font-size:40px;background:hsl(var(--h,120) var(--art-s) var(--art-l))}
.art.lg{width:100%;height:150px;font-size:72px;border-radius:var(--radius)}
.card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.card-body h3{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{font-size:13px;color:var(--muted)}
.macros{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.macro{font-size:12px;font-weight:600;background:var(--surface-2);border-radius:8px;padding:3px 7px;white-space:nowrap}
.missing{font-size:13px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:6px;padding:2px 6px;background:var(--brand-soft);color:var(--brand);margin-right:4px;vertical-align:middle}
.tag.ai{background:var(--accent-soft);color:var(--accent)}
.group-h{display:flex;align-items:center;gap:8px;margin:24px 0 10px}
.group-h .dot{width:10px;height:10px;border-radius:50%}
.more-btn{width:100%;margin-top:4px}

/* inventory */
.inv-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.inv-group h3{font-family:var(--font);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 16px 6px}
.item{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer;min-height:52px}
.inv-group h3 + .item{border-top:0}
.item-main{flex:1;min-width:0}
.item-name{font-weight:600;text-transform:capitalize}
.item-sub{font-size:13px;color:var(--muted)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.badge{font-size:12px;font-weight:600;border-radius:8px;padding:2px 7px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--brand-soft);color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px}
.stat b{display:block;font-family:var(--font-d);font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}

/* scan */
.scan-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.scan-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--line);background:var(--surface);border-radius:var(--radius);padding:22px 10px;font-weight:600;min-height:120px}
.scan-btn .ic{font-size:34px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:0;right:0;width:44px;height:44px;border-radius:50%;border:0;background:radial-gradient(circle,rgba(0,0,0,.6) 13.5px,transparent 14.5px);color:#fff;font-size:15px}
.review-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px}
.review-item.off{opacity:.45}
.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.review-grid .input{min-height:40px;padding:8px 10px;font-size:15px}
.review-top{display:flex;gap:10px;align-items:center}
.review-top input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand);flex:none}
.review-top .input{font-weight:600}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 10px;text-align:center;color:var(--muted)}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:spin .8s linear infinite}
.spinner.sm{width:18px;height:18px;border-width:2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);min-height:54px;width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.li:first-child{border-top:0}
.li .ic{font-size:22px;width:28px;text-align:center}
.li .chev{color:var(--muted);font-size:18px}
.li input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand);flex:none}
.li.done .li-title{text-decoration:line-through;color:var(--muted)}
.li-title{font-weight:600}

/* recipe detail */
.detail-head{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.ing-list{list-style:none;margin:0;padding:0}
.ing{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ing:last-child{border-bottom:0}
.ing .st{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.ing.have .st{background:var(--brand-soft);color:var(--brand)}
.ing.miss .st{background:var(--accent-soft);color:var(--accent)}
.ing .amt{font-weight:700;white-space:nowrap}
.ing .nm{flex:1;min-width:0}
.ing.basic .st{background:var(--surface-2);color:var(--muted)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 16px 42px;line-height:1.55}
.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:14px}
.cart-row{border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;background:var(--surface)}
.cart-row.off{opacity:.5}
.cart-row .row{align-items:flex-start}
.prod-opts{display:grid;gap:8px;margin-top:10px}
.prod{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--surface);text-align:left;width:100%}
.prod.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.prod img{width:48px;height:48px;object-fit:contain;border-radius:8px;background:#fff;flex:none}
.prod .pt{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.tab .ti{font-size:21px;line-height:1}
.tab.on{color:var(--brand)}
.tab.fab .ti{width:52px;height:52px;border-radius:18px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:24px;margin-top:-22px;box-shadow:0 6px 16px rgba(46,106,78,.35)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;pointer-events:none}
.sheet-backdrop{position:absolute;inset:0;background:rgba(10,14,12,.45);opacity:0;transition:opacity .2s}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92vh;background:var(--bg);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden}
.sheet.open{pointer-events:auto}
.sheet.open .sheet-backdrop{opacity:1}
.sheet.open .sheet-panel{transform:none}
.sheet-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px 18px;flex:none}
.sheet-grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
#sheet-body{overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet-foot{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 22%);padding:18px 0 4px;margin-top:6px}

/* onboarding */
#onboard{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto}
.ob{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px)}
.ob-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:20px 0}
.ob-hero{font-size:84px;line-height:1;text-align:center}
.ob h1{font-size:34px;text-align:center}
.ob .lead{text-align:center;color:var(--muted);font-size:17px}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.ob-foot{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(env(safe-area-inset-bottom) + 8px);z-index:1}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .2s}
.dots i.on{width:22px;background:var(--brand)}
.tut{display:flex;flex-direction:column;gap:10px}

<script>
/* ================= DATA: recipe library + staples catalog ================= */
const UNITS = ['cup','tbsp','tsp','lb','oz','g','kg','ml','l','clove','can','whole','slice','pinch','bunch','stalk','head','sheet','leaf','pkg','sprig','jar','ear'];

function parseQty(s){
  s = String(s).trim();
  if (/^\d+\/\d+$/.test(s)) { const [a,b] = s.split('/').map(Number); return a/b; }
  const n = parseFloat(s); return isFinite(n) ? n : 1;
}
function parseIng(s){
  s = String(s || '').trim(); if (!s) return null;
  const parts = s.split(/\s+/);
  let qty = 1, i = 0;
  if (/^[\d.\/]+$/.test(parts[0])) { qty = parseQty(parts[0]); i = 1; }
  let unit = '';
  if (parts[i] && UNITS.includes(parts[i].toLowerCase())) { unit = parts[i].toLowerCase(); i++; }
  const name = parts.slice(i).join(' ').trim();
  if (!name) return null;
  return { qty, unit: unit === 'whole' ? '' : unit, name };
}

const LIB = [];
function R(title, cuisine, meal, time, servings, kcal, protein, carbs, ings, steps){
  LIB.push({
    id: 'lib-' + (LIB.length + 1), title, cuisine, meal, time, servings,
    nutrition: { kcal, protein, carbs },
    ingredients: ings.split(';').map(parseIng).filter(Boolean),
    steps: steps.split('|').map(s => s.trim()).filter(Boolean),
    source: 'library'
  });
}

/* ---- Breakfast ---- */
R('Classic Scrambled Eggs','American','Breakfast',10,2,280,18,2,
'4 whole eggs; 2 tbsp milk; 1 tbsp butter; 1 pinch salt; 1 pinch black pepper; 1 tbsp chives',
'Whisk eggs, milk, salt and pepper until no streaks remain.|Melt butter in a nonstick pan over medium-low heat.|Add the eggs and stir slowly with a spatula, pulling curds in from the edges.|Take off the heat while still slightly glossy — they finish cooking on the plate.|Top with chopped chives and serve.');

'1.5 cup flour; 2 tbsp sugar; 2 tsp baking powder; 1/4 tsp salt; 1.25 cup milk; 1 whole egg; 3 tbsp butter; 1/4 cup maple syrup',
'Whisk flour, sugar, baking powder and salt in a bowl.|Melt the butter. In a second bowl whisk milk, egg and melted butter.|Pour wet into dry and stir just until combined — lumps are fine.|Heat a lightly greased skillet over medium. Pour 1/4 cup batter per pancake.|Flip when bubbles form and the edges look set, about 2 minutes. Cook 1 minute more.|Serve warm with maple syrup.');
R('Avocado Toast with Egg','American','Breakfast',10,2,380,14,30,
'2 slice bread; 1 whole avocado; 2 whole eggs; 1 tsp lemon juice; 1 pinch red pepper flakes; 1 pinch salt',
'Toast the bread until golden.|Mash avocado with lemon juice and salt.|Fry or poach the eggs to your liking.|Spread avocado on the toast and top each slice with an egg.|Finish with red pepper flakes.');

'1 cup rolled oats; 1 cup milk; 1/2 cup greek yogurt; 1 tbsp chia seeds; 1 tbsp honey; 1/2 cup blueberries',
'Stir oats, milk, yogurt, chia seeds and honey together.|Divide between two jars and cover.|Refrigerate at least 4 hours or overnight.|Top with blueberries before serving.');
R('Huevos Rancheros','Mexican','Breakfast',25,4,420,18,38,
'8 whole corn tortillas; 8 whole eggs; 1 can black beans; 1 cup salsa; 1/2 cup cotija cheese; 1 whole avocado; 2 tbsp vegetable oil; 1/4 cup cilantro',
'Warm the black beans in a small pot with a splash of water and mash lightly.|Heat the salsa in another pan until bubbling.|Crisp the tortillas in a little oil, about 30 seconds per side.|Fry the eggs sunny-side up in the remaining oil.|Layer tortillas, beans, eggs and salsa. Top with cotija, avocado and cilantro.');
R('Shakshuka','Middle Eastern','Breakfast',30,4,260,14,16,
'2 tbsp olive oil; 1 whole onion; 1 whole bell pepper; 3 clove garlic; 1 tsp cumin; 1 tsp paprika; 1 can crushed tomatoes; 6 whole eggs; 1/4 cup feta cheese; 2 tbsp parsley',
'Heat oil in a large skillet. Cook diced onion and pepper until soft, about 6 minutes.|Add minced garlic, cumin and paprika and cook 1 minute.|Pour in the tomatoes, season with salt and simmer 10 minutes until thickened.|Make small wells in the sauce and crack an egg into each.|Cover and cook 5–8 minutes until the whites are set.|Top with feta and parsley.');
R('Breakfast Burritos','Mexican','Breakfast',20,4,520,26,42,

'Dice potatoes small and fry in oil until crisp and tender, about 12 minutes.|Brown the sausage in a separate pan, breaking it up.|Scramble the eggs and fold in the sausage and potatoes.|Warm the tortillas and fill with the mixture, cheese and salsa.|Roll tightly, tucking in the sides.');
R('Greek Yogurt Parfait','Mediterranean','Breakfast',5,2,310,18,40,
'1.5 cup greek yogurt; 1/2 cup granola; 1 cup strawberries; 1 tbsp honey',

R('Spinach Feta Omelette','Mediterranean','Breakfast',15,2,320,22,4,
'5 whole eggs; 2 cup spinach; 1/3 cup feta cheese; 1 tbsp butter; 1 pinch salt; 1 pinch black pepper',
'Whisk eggs with salt and pepper.|Wilt the spinach in half the butter and set aside.|Melt the remaining butter, pour in the eggs and let them set at the edges.|Add spinach and feta to one half, fold, and cook 1 more minute.|Slice in half to serve two.');
R('French Toast','French','Breakfast',20,4,380,12,48,
'8 slice bread; 4 whole eggs; 1 cup milk; 1 tsp vanilla extract; 1 tsp cinnamon; 2 tbsp butter; 1/4 cup maple syrup',

/* ---- Lunch ---- */
R('Chicken Caesar Salad','American','Lunch',20,4,450,38,14,
'1.5 lb chicken breast; 2 head romaine lettuce; 1/2 cup caesar dressing; 1/2 cup parmesan cheese; 1 cup croutons; 1 tbsp olive oil; 1 whole lemon',

R('Mediterranean Chickpea Salad','Mediterranean','Lunch',15,4,320,12,38,

R('Tomato Basil Soup','Italian','Lunch',35,4,220,5,24,
'2 tbsp olive oil; 1 whole onion; 3 clove garlic; 2 can crushed tomatoes; 2 cup vegetable broth; 1/2 cup heavy cream; 1/4 cup basil',

R('Black Bean Quesadillas','Mexican','Lunch',15,4,430,18,46,

R('Chicken Fried Rice','Chinese','Lunch',25,4,480,26,58,

R('Miso Soup with Tofu','Japanese','Lunch',15,4,120,9,8,

R('Greek Salad','Mediterranean','Lunch',15,4,240,6,12,

R('Tuna Melt','American','Lunch',15,2,520,32,30,

R('Red Lentil Soup','Middle Eastern','Lunch',45,6,280,16,42,
'1.5 cup red lentils; 1 whole onion; 2 whole carrots; 3 clove garlic; 1 tsp cumin; 6 cup vegetable broth; 2 tbsp olive oil; 1 whole lemon',

R('Cold Sesame Noodles','Chinese','Lunch',20,4,450,13,58,

/* ---- Shipped Amazon product picks for staples (owned by the amazon agent) ----
   Keys must match a STAPLES name exactly. Never invent ASINs: leave an item out until Wyatt has looked it up.
   Per-item fields:
     asin     10-character Amazon ASIN, from Wyatt's phone lookup or the Creators API only
     per      items per pack for countable items (eggs 12, tortillas 10). 0 = use the STAPLES pack count / buy 1
     size     human note, e.g. '16.9 fl oz' (catalog screen only)
     verified true only after Wyatt confirms the product page matches. The one-tap cart ignores unverified ASINs
              and uses a tagged search link instead.
     checked  ISO date Wyatt last confirmed it (re-check about every 6 months)
     src      'wyatt-phone' or 'creators-api'
   Example: 'olive oil': { asin: '', per: 0, size: '', verified: false, checked: '', src: '' },
   Bump STAPLE_ASINS_VERSION on every change so existing users get the new picks merged into their saved catalog. */
const STAPLE_ASINS_VERSION = 1;
const STAPLE_ASINS = {};

function buildDefaultCatalog(){
  const out = [];
  for (const [cat, list] of Object.entries(STAPLES)) {
    for (const raw of list.split(',')) {
      const [name, per] = raw.trim().split('|');
      if (!name) continue;
      const a = STAPLE_ASINS[name] || {};
      out.push({ id: 'c' + out.length, name, cat, per: a.per > 0 ? Number(a.per) : per ? Number(per) : 0, asin: a.asin || '', title: '', term: name,
        size: a.size || '', verified: a.verified === true, checked: a.checked || '', src: a.src || '', asinSrc: a.asin ? 'shipped' : '' });
    }
  }
  return out;
}

function computeFeed() {

  const groups = { ready: [], near: [], shop: [] };
  const seen = new Set();
  for (const r of [...S.aiRecipes, ...LIB]) {
    const key = r.title.toLowerCase(); if (seen.has(key)) continue; seen.add(key);
    if (f.cuisines.length && !f.cuisines.includes(r.cuisine)) continue;
    if (f.meal !== 'Any' && r.meal !== f.meal) continue;
    if (f.maxTime && r.time > f.maxTime) continue;
    if (goal && goal.test && !goal.test(r)) continue;
    if (cw.length && !cw.every(t => r.ingredients.some(i => nameMatch(t, i.name) || norm(i.name).includes(norm(t))))) continue;

  if (!scan.images.length || scan.busy) return;
  scan.busy = true; scan.mode = 'list-ai'; scan.error = ''; scan.errorCode = ''; render();
  try {
    const imgs = await Promise.all(scan.images.slice(0, 2).map(src => toJpeg(src, 'receipt')));
    const content = [
      ...imgs.map(src => ({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: src.split(',')[1] } })),
      { type: 'text', text: `${imgs.length > 1 ? 'These images show one' : 'This image shows a'} shopping list, printed or handwritten. List every item on it, in order. Use plain lowercase grocery names and fix obvious misspellings. q = how many, only if written (e.g. "2 milk", "milk x2"); omit if 1.
Return compact JSON only, no prose: {"items":[{"n":"milk","q":2}]}
If nothing is readable, return {"items":[]}.` }
    ];
    const text = await callClaude({ system: 'You read shopping lists. Respond with JSON only.', content, maxTokens: 400, purpose: 'list' });
    const data = extractJSON(text);
    const rows = (Array.isArray(data) ? data : data.items || []).map(x => {
      const name = String(x && (x.n ?? x.name) || '').replace(/[^\p{L}\s&'’-]/gu, ' ').replace(/\s+/g, ' ').trim().toLowerCase().slice(0, 60);
      return name ? { on: true, name, qty: clamp(Math.round(Number(x.q ?? x.qty) || 1), 1, 20), need: '' } : null;
    }).filter(Boolean).slice(0, 60);
    if (!rows.length) throw new Error('Couldn’t find items on that list. Try a closer, brighter photo, or type them in Shop.');
    scan.list = rows; scan.listSource = 'ai'; ocr.few = false; ocr.found = null;
  } catch (e) { scan.error = e.message; scan.errorCode = e.code || ''; }
  scan.busy = false; scan.mode = '';
  if (S.ui.tab === 'scan') render(); else if (scan.list) toast('List ready to review');
}

const AMZ = 'https://www.amazon.com';

function catalogFind(name) {
  const n = norm(name); if (!n) return null;
  const k = looseKey(name), exact = S.catalog.find(c => looseKey(c.name) === k); if (exact) return exact;
  const A = n.split(' '); let best = null, bestScore = -Infinity;
  for (const c of S.catalog) {
    const cn = norm(c.name); if (cn !== n && !nameMatch(name, c.name)) continue;
    const B = cn.split(' '), diff = [...A.filter(w => !B.includes(w)), ...B.filter(w => !A.includes(w))];

    const score = (cn === n ? 100 : 0) + (sameHead ? 10 : 0) - diff.length;
    if (score > bestScore) { best = c; bestScore = score; }
  }

}

  if (ing.unit) return 1;
  if (cat && cat.per > 1) return clamp(Math.ceil(q / cat.per), 1, 10);
  if (!cat || cat.cat === 'Produce') return clamp(Math.ceil(q), 1, 10);

    const prev = toks[i - 1]; if (prev && prev.t === 'fqty') { lq = prev.q; ev = true; }
    for (let j = i + 1; j < toks.length && j <= i + 4 && toks[j].t !== 'text' && toks[j].t !== 'fqty'; j++) {
      ev = true; if (toks[j].t === 'qty' && lq == null) { lq = toks[j].q; lu = toks[j].u; }
    }
    if (ORDER_NONFOOD.test(tk.l)) return;
    const c = orderStaple(p.seg);
    let name = c ? c.name : p.seg.replace(ORDER_BRANDS, ' ').replace(ORDER_WORDS, ' ').replace(/[^\p{L}\s&'’-]/gu, ' ').replace(/\s+/g, ' ').trim().toLowerCase();
    if (!/\p{L}{2}/u.test(name)) return;
    const hint = !c && ORDER_FOOD_HINT.some(w => hasWord(name, w));
    // No quantity or price near it and no known staple: prose, unless it's a short list line naming a food ("Sugar snap peas").
    if (!c && !ev && !(hint && p.seg.split(' ').length <= 5)) return;
    const n = p.q ?? lq ?? 1; let qty = n, unit = p.qu || lu;
    if (!unit) { if (p.count) qty = n * p.count; else if (p.size) { qty = n * p.size; unit = p.su; } }
    qty = clamp(Math.round(qty * 100) / 100 || 1, 0.01, 999);
    out.push({ name, qty, unit, category: guessCategory(name), maybe: !c && !hint });
  });
  // Same food twice (e.g. two shipments): one row with the amounts added up.
  const merged = [];
  for (const x of out) {
    const m = merged.find(y => norm(y.name) === norm(x.name) && y.unit === x.unit);
    if (m) { m.qty = Math.round((m.qty + x.qty) * 100) / 100; m.maybe = m.maybe && x.maybe; } else merged.push(x);
  }
  return merged;
}
// Text for the optional AI read: drop greeting/name, address, card, contact and order-number lines, and cap the length.
function orderTextForAI(text) {
  const keep = []; let addr = 0;
  for (const raw of String(text || '').split(/\r?\n/)) {
    const l = raw.replace(/\s+/g, ' ').trim();
    if (!l) { addr = 0; continue; }
    if (ORDER_ADDR_HEAD.test(l)) { addr = 5; continue; }
    if (addr) { addr = /\b[A-Z]{2},?\s+\d{5}(-\d{4})?\b/.test(l) ? 0 : addr - 1; continue; }
    if (ORDER_PII.some(r => r.test(l))) continue;
    keep.push(l);
  }
  return keep.join('\n').slice(0, 4000);
}

async function searchOnline() {

/* ---- pantry ---- */
function expiryBadge(iso) {
  const d = daysUntil(iso); if (d == null) return '';
  if (d < 0) return `<span class="badge danger">Expired ${-d}d ago</span>`;
  if (d === 0) return `<span class="badge danger">Use today</span>`;
  if (d === 1) return `<span class="badge warn">Use tomorrow</span>`;
  if (d <= 3) return `<span class="badge warn">${d} days left</span>`;
  if (d <= 7) return `<span class="badge">${d} days</span>`;
  if (d > 60) return `<span class="badge">Good till ${new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', year: 'numeric' })}</span>`;
  return `<span class="badge">${fmtDate(iso)}</span>`;
}
function viewPantry() {
  const inv = S.inventory;
  const exp = inv.filter(i => { const d = daysUntil(i.expires); return d != null && d >= 0 && d <= 3; });
  const expired = inv.filter(i => { const d = daysUntil(i.expires); return d != null && d < 0; });
  const flagged = inv.filter(i => conflictsFor([i.name]).length);
  const filter = S.ui.pantryFilter;
  let list = inv;
  if (filter === 'soon') list = inv.filter(i => { const d = daysUntil(i.expires); return d != null && d <= 3; });
  if (filter === 'allergen') list = flagged;
  const groups = CATEGORIES.map(c => [c, list.filter(i => (CATEGORIES.includes(i.category) ? i.category : 'Other') === c).sort((a, b) => (a.expires || '9').localeCompare(b.expires || '9'))]).filter(([, l]) => l.length);
  return `<header class="top"><div><p class="eyebrow">${inv.length} item${inv.length === 1 ? '' : 's'}</p><h1>Pantry</h1></div>
    <button class="icon-btn" data-act="addItem">＋ Add</button></header>${arrivalCard()}
    ${inv.length ? `<div class="stats">
      <div class="stat"><b>${exp.length}</b><span>Use within 3 days</span></div>
      <div class="stat"><b style="color:${expired.length ? 'var(--danger)' : 'inherit'}">${expired.length}</b><span>Expired</span></div>
      <div class="stat"><b style="color:${flagged.length ? 'var(--danger)' : 'inherit'}">${flagged.length}</b><span>Allergen flags</span></div></div>
      ${hasAllergies() ? allergyNote('margin:-4px 0 14px') : ''}
      ${exp.length ? `<button class="btn btn-soft btn-block" style="margin-bottom:14px" data-act="useItUp">🍳 Cook with what’s expiring</button>` : ''}
      <div class="chips scroll" style="margin-bottom:14px">
        <button class="chip ${filter === 'all' ? 'on' : ''}" data-act="pantryFilter" data-v="all">All</button>
        <button class="chip ${filter === 'soon' ? 'on' : ''}" data-act="pantryFilter" data-v="soon">Expiring soon</button>
        <button class="chip ${filter === 'allergen' ? 'on' : ''}" data-act="pantryFilter" data-v="allergen">Allergen flags</button></div>
      ${groups.length ? groups.map(([c, l]) => `<section class="inv-group"><h3>${CAT_ICON[c]} ${c}</h3>${l.map(itemRow).join('')}</section>`).join('') : `<div class="empty"><p>Nothing here.</p></div>`}`
      : `<div class="empty"><div class="big">🧺</div><h3>Your pantry is empty</h3><p style="margin-bottom:16px">Scan a receipt, a barcode or a pasted order and Pantry Pal fills this in.</p>
        <div class="stack"><button class="btn btn-primary" data-act="goto" data-tab="scan">📸 Scan something</button><button class="btn btn-ghost" data-act="addItem">Add an item by hand</button></div></div>`}`;
}
function itemRow(i) {

    <div class="item-main"><div class="item-name">${esc(i.name)}</div>
      <div class="badges">${i.qty ? `<span class="item-sub">${esc(fmtQty(i.qty, i.unit) + (i.unit ? ' ' + i.unit : ''))}</span>` : ''}${expiryBadge(i.expires)}${cf.map(c => `<span class="badge danger">⚠ ${esc(c.label)} · ${esc(c.who.join(', '))}</span>`).join('')}</div></div>

async function loadSteps(r) {

      content: [{ type: 'text', text: `Write clear cooking steps for this recipe. Include temperatures, times and doneness cues. 4–9 steps. Do not include links or references to websites.
Recipe: ${JSON.stringify({ title: r.title, servings: r.servings, ingredients: r.ingredients.map(i => [i.qty, i.unit, i.name].filter(Boolean).join(' ')) })}
Return: {"steps":["..."]}` }], maxTokens: 1500, purpose: 'steps'

// The payload part of a signed token ("<base64url JSON>.<signature>"), read only to show the plan. Not trusted.
function tokenPayload(t) {
  try { const b = String(t).split('.')[0].replace(/-/g, '+').replace(/_/g, '/'); const p = JSON.parse(atob(b + '==='.slice((b.length + 3) % 4))); return p && typeof p === 'object' ? p : null; } catch (e) { return null; }
}
// The backend checks the code (a Premium token or an owner test code) and returns a signed token.
// If the backend has no /api/premium/redeem yet, a token-shaped code is stored as is and checked on the first scan.
async function redeemPremium(code) {
  const d = codeDraft; if (!d || d.busy) return;
  code = String(code || '').trim();
  if (!/^[\w.~+/=-]{4,1200}$/.test(code)) { d.err = 'That code doesn’t look right. Check it and try again.'; return drawSheet(); }
  d.busy = true; d.err = ''; drawSheet();
  let got = null, err = '';
  const b = backend();
  if (b) {
    try {
      const res = await fetch(b + '/api/premium/redeem', { method: 'POST', headers: bheaders(), body: JSON.stringify({ code }) });
      const data = await res.json().catch(() => ({}));
      if (res.ok) got = sanitizePremium({ token: data.token, exp: data.exp, plan: data.plan });
      else if (![404, 405, 501].includes(res.status)) err = typeof data.error === 'string' && data.error ? data.error.slice(0, 200) : 'That code isn’t valid or has expired.';
      if (res.ok && !got) err = 'Couldn’t read the answer from Pantry Pal. Try again.';
      if (res.ok && data.quota) readQuota('scan', res, data);
    } catch (e) { err = 'Couldn’t reach Pantry Pal. Check your connection and try again.'; }
  }
  if (!got && !err) {
    const p = tokenPayload(code);
    got = p ? sanitizePremium({ token: code, exp: p.exp, plan: p.plan }) : null;
    if (!got) err = b ? 'That code isn’t valid or has expired.' : 'Codes are checked by Pantry Pal online. Open the app from the Pantry Pal website and try again.';
  }
  if (!codeDraft) return;   // sheet was closed
  d.busy = false;
  if (got && got.exp <= Date.now()) { got = null; err = 'That code has expired.'; }
  if (!got) { d.err = err; return drawSheet(); }
  S.premium = got; persist(); closeSheet(); render();
  toast(`Premium is on until ${new Date(got.exp).toLocaleDateString()}`);
}

// AI reply in the compact scan format → review rows.
function scanItems(data) {
  return (Array.isArray(data) ? data : data.items || []).map(x => {
    if (!x || typeof x !== 'object') return null;
    const name = String(x.n ?? x.name ?? '').trim(); if (!name) return null;
    const cat = x.c ?? x.category, category = CATEGORIES.includes(cat) ? cat : guessCategory(name);
    let unit = String(x.u ?? x.unit ?? '').toLowerCase().trim(); if (['count', 'each', 'ea', 'whole', 'item', 'pc'].includes(unit)) unit = '';
    const d = x.d ?? x.expires_in_days, days = d != null && d !== '' && Number.isFinite(Number(d)) ? Math.round(Number(d)) : SHELF[category];

    const i = S.household.members.findIndex(x => x.id === d.id); if (i >= 0) S.household.members[i] = m; else S.household.members.push(m);
    persist(); closeSheet(); render(); toast('Saved');
  },
  deleteMember: () => { const id = memberDraft.id; S.household.members = S.household.members.filter(m => m.id !== id); persist(); closeSheet(); render(); },

  testBackend: async el => { el.disabled = true; el.textContent = 'Testing…'; await checkHealth(); },
  clearAi: () => askConfirm('Remove all AI-generated recipes? Library and community recipes stay.', 'Remove AI recipes', () => { S.aiRecipes = []; persist(); render(); }),
  exportData: () => {
    const blob = new Blob([JSON.stringify(S, (k, v) => (k && k[0] === '_') || k === 'userKey' || k === 'appToken' || k === 'premium' ? undefined : v, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `pantry-pal-backup-${todayISO()}.json`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  importData: () => $('#import').click(),
  resetAll: () => askConfirm('This erases your pantry, household, lists and settings on this device.', 'Erase everything', async () => {
    S = defaultState(); await Store.save(S); ob = { step: 0, name: '', allergies: [], custom: [], diets: [], party: 2, key: '' }; health = null; renderOnboard(); render();
  }),
  resetCatalog: () => askConfirm('Reset the staples catalog? Any ASINs you added will be cleared.', 'Reset catalog', () => { S.catalog = buildDefaultCatalog(); persist(); render(); }),
  replayTour: () => { S.onboarded = false; ob.step = 1; ob.party = S.household.partySize; renderOnboard(); },

  newShare: () => { shareDraft = { title: '', cuisine: 'American', meal: 'Dinner', time: 30, servings: 4, kcal: '', protein: '', carbs: '', ings: '', steps: '', author: firstName(), err: '', busy: false }; openSheet(shareSheet); },
  submitShare: async () => {
    const d = shareDraft;
    const ingredients = d.ings.split('\n').map(parseIng).filter(Boolean), steps = d.steps.split('\n').map(s => s.replace(/^\s*\d+[.)]\s*/, '').trim()).filter(Boolean);
    if (!d.title.trim()) { d.err = 'Add a recipe name.'; return drawSheet(); }
    if (!ingredients.length) { d.err = 'Add at least one ingredient.'; return drawSheet(); }
    if (!steps.length) { d.err = 'Add at least one step.'; return drawSheet(); }
    if (/https?:\/\/|www\./i.test(d.steps + d.ings)) { d.err = 'Please keep links out of recipes — everything stays in the app.'; return drawSheet(); }
    const payload = { title: d.title.trim(), cuisine: d.cuisine, meal: d.meal, time_minutes: Number(d.time) || 30, servings: Number(d.servings) || 4, calories: Number(d.kcal) || 0, protein_g: Number(d.protein) || 0, carbs_g: Number(d.carbs) || 0, ingredients, steps, author: d.author.trim().slice(0, 30) || 'Anonymous' };
    d.busy = true; d.err = ''; drawSheet();
    try {
      if (backend()) {
        const res = await fetch(backend() + '/api/community', { method: 'POST', headers: bheaders(), body: JSON.stringify(payload) });
        const data = await res.json().catch(() => ({})); if (!res.ok) throw new Error(data.error || 'Couldn’t share right now.');
        comm.items = null;
      } else {
        const r = normalizeAiRecipe(payload, 4); r.id = 'local-' + uid(); r.source = 'community'; r.author = payload.author; r.steps = steps; S.community.unshift(r); persist();
      }
      closeSheet(); toast('Shared! 🎉'); goto('community');
    } catch (e) { d.busy = false; d.err = e.message; drawSheet(); }
  },

  obNext: () => { if (ob.step >= 3) return finishOnboarding(); ob.step++; renderOnboard(); },
  obBack: () => { ob.step = Math.max(0, ob.step - 1); renderOnboard(); },
  obSkip: () => finishOnboarding(),
  obAllergy: el => { const a = ob.allergies, k = el.dataset.k, i = a.indexOf(k); i >= 0 ? a.splice(i, 1) : a.push(k); renderOnboard(); },
  obDiet: el => { const a = ob.diets, k = el.dataset.d, i = a.indexOf(k); i >= 0 ? a.splice(i, 1) : a.push(k); renderOnboard(); },
  obCustomRm: el => { ob.custom.splice(Number(el.dataset.i), 1); renderOnboard(); },
  obParty: el => { ob.party = clamp(ob.party + Number(el.dataset.d), 1, 30); renderOnboard(); }
};

/* ================= EVENTS ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName !== 'A') e.preventDefault();
  fn(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && bc.cam) return bcCamClose();
  if (e.key === 'Escape' && sheet) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.item[data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e => {
  const el = e.target, ds = el.dataset;
  if (ds.live === 'libq') { lib.q = el.value; $('#lib-results').innerHTML = libraryResults(); return; }
  if (ds.live === 'catq') { catQ = el.value; const q = norm(catQ); $('#cat-list').innerHTML = catalogList(S.catalog.filter(c => !q || norm(c.name).includes(q) || norm(c.cat).includes(q))); return; }
  if (ds.scan != null && ds.f !== 'on' && scan.items) { const it = scan.items[Number(ds.scan)]; if (it) it[ds.f] = el.value; return; }
  if (ds.li != null && ds.f === 'name' && scan.list) { const it = scan.list[Number(ds.li)]; if (it) it.name = el.value.slice(0, 60); return; }
  if (ds.bc != null) { const x = bc.list[Number(ds.bc)]; if (x) x.name = el.value.slice(0, 60); return; }
  if (ds.draft && itemDraft) {
    itemDraft[ds.draft] = el.value;
    if (ds.draft === 'name' && !itemDraft.id && !itemDraft._catTouched) {
      const c = catalogFind(el.value); const cat = c ? c.cat : 'Other';
      if (cat !== itemDraft.category) { itemDraft.category = cat; itemDraft.expires = addDays(SHELF[cat]); const sel = $('[data-draft=category]'), ex = $('[data-draft=expires]'); if (sel) sel.value = cat; if (ex) ex.value = itemDraft.expires; }
    }
    return;
  }
  if (ds.mdraft && memberDraft) { memberDraft[ds.mdraft] = el.value; return; }
  if (ds.share && shareDraft) { shareDraft[ds.share] = el.value; return; }
  if (ds.ob) { ob[ds.ob] = el.value; return; }
  if (ds.cat) { const c = S.catalog.find(x => x.id === ds.cat); if (c) { c[ds.f] = ds.f === 'asin' ? el.value.trim().toUpperCase() : el.value; if (ds.f === 'asin') { c.title = ''; c.asinSrc = c.asin ? 'user' : ''; } persist(); } return; }
});
document.addEventListener('change', e => {
  const el = e.target, ds = el.dataset;
  if (ds.bind === 'cookWith') { S.filters.cookWith = el.value.trim(); persist(); render(); return; }
  if (ds.setting) { S.settings[ds.setting] = el.value.trim(); persist(); if (ds.setting === 'backendUrl') { health = null; comm.items = null; online.items = null; if (backend()) checkHealth(true); } if (ds.setting === 'userKey' && el.value.trim()) toast('Key saved on this device'); render(); return; }
  if (ds.settingBool) { S.settings[ds.settingBool] = el.checked; persist(); render(); return; }
  if (ds.scan != null && scan.items) { const it = scan.items[Number(ds.scan)]; if (!it) return; if (ds.f === 'on') { it.on = el.checked; render(); } else it[ds.f] = el.value; return; }
  if (ds.li != null && scan.list) { const it = scan.list[Number(ds.li)]; if (!it) return; if (ds.f === 'on') it.on = el.checked; else it.name = el.value.trim().slice(0, 60); render(); return; }
  if (ds.sl) { const x = S.shopping.find(s => s.id === ds.sl); if (x) { x.done = el.checked; persist(); render(); } return; }
  if (ds.arrck != null && arriveDraft) { const x = arriveDraft[Number(ds.arrck)]; if (x) x.on = el.checked; drawSheet(); return; }
  if (ds.cartck != null && cartDraft) { cartDraft.items[Number(ds.cartck)].on = el.checked; drawSheet(); return; }
  if (ds.draft && itemDraft) { itemDraft[ds.draft] = el.value; if (ds.draft === 'category') itemDraft._catTouched = true; if (ds.draft === 'category' && !itemDraft.id) { itemDraft.expires = addDays(SHELF[el.value]); drawSheet(); } return; }
  if (ds.share && shareDraft) { shareDraft[ds.share] = el.value; return; }
  if (ds.plan && planDraft) { if (/^\d{4}-\d{2}-\d{2}$/.test(el.value)) planDraft.start = el.value < todayISO() ? todayISO() : el.value; drawSheet(); return; }
  if (el.id === 'cam' || el.id === 'gal') { addFiles(el.files); el.value = ''; return; }
  if (el.id === 'bc-photo') { const f = el.files[0]; el.value = ''; bcFromPhoto(f); return; }
  if (el.id === 'import') {
    const f = el.files[0]; el.value = ''; if (!f) return;
    f.text().then(t => { const data = JSON.parse(t); if (!data || !Array.isArray(data.inventory)) throw new Error(); const { userKey, admin, backendUrl, appToken, tag } = S.settings; const keep = { userKey, admin, backendUrl, appToken, tag }, premium = S.premium; S = hydrate(sanitizeBackup(data)); Object.assign(S.settings, keep); S.premium = premium; persist(); render(); toast('Backup restored'); }).catch(() => toast('That file isn’t a Pantry Pal backup'));
  }
});
// Coming back to the app (e.g. from an Amazon tab): refresh the "did your order arrive?" card.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') { bcCamClose(); return; }   // release the camera when the app is hidden
  if (arrival.left) { arrival.left = false; arrival.soft = true; }
  if (S.onboarded && ['cook', 'pantry'].includes(S.ui.tab)) render();
});
document.addEventListener('toggle', e => { const el = e.target; if (el.dataset && el.dataset.details) { S.ui[el.dataset.details] = el.open; persist(); } }, true);
document.addEventListener('submit', e => {
  const form = e.target.closest('[data-form]'); if (!form) return; e.preventDefault();
  const kind = form.dataset.form; const inp = form.querySelector('input'); const v = inp.value.trim(); if (!v) return;
  if (kind === 'premiumCode') { redeemPremium(v); return; }
  if (kind === 'bcCode') { const code = v.replace(/\D/g, ''); if (!validBarcode(code)) return toast('That doesn’t look like a barcode number. Check the digits under the bars.'); inp.value = ''; bc.note = ''; bcAdd(code); return; }
  if (kind === 'slAdd') { const p = parseIng(v); const hasNum = /^[\d.\/]/.test(v); S.shopping.push({ id: uid(), name: hasNum && p ? p.name : v, need: hasNum && p ? fmtAmount(p.qty, p.unit) : '', amount: hasNum && p ? p.qty : 1, unit: hasNum && p ? p.unit : '', done: false }); persist(); render(); $('[data-form="slAdd"] input')?.focus(); return; }
  if (kind === 'mCustom' && memberDraft) { if (!memberDraft.custom.some(t => norm(t) === norm(v))) memberDraft.custom.push(v.slice(0, 40)); drawSheet(); return; }
  if (kind === 'obCustom') { if (!ob.custom.some(t => norm(t) === norm(v))) ob.custom.push(v.slice(0, 40)); renderOnboard(); return; }
  if (kind === 'catAdd') { if (S.catalog.some(c => norm(c.name) === norm(v))) return toast('Already in the catalog'); S.catalog.unshift({ id: 'c' + uid(), name: v.toLowerCase(), cat: 'Other', per: 0, asin: '', title: '', term: v }); persist(); catQ = ''; render(); return; }
});

/* ================= BOOT ================= */
function setupPWA() {
  // Tomato jar icon: src/icon.svg, inlined into <link rel="icon"> by build.py. The apple-touch-icon PNG is in the shell.
  const iconUrl = document.querySelector('link[rel="icon"]')?.href || '';
  const manifest = { name: 'Pantry Pal', short_name: 'Pantry Pal', start_url: location.href.split('#')[0], display: 'standalone', background_color: '#FAF6EF', theme_color: '#2E6A4E', icons: iconUrl ? [{ src: iconUrl, sizes: 'any', type: 'image/svg+xml', purpose: 'any maskable' }] : [] };
  try {
    const link = document.createElement('link'); link.rel = 'manifest'; link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' })); document.head.appendChild(link);
  } catch (e) { }
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !hasClaudeBuiltin() && !window.storage) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* optional: add sw.js next to this file for offline support */ });
  }
}
async function boot() {
  Store.init();
  S = hydrate(await Store.load());
  if (S.ui.tab === 'scan' && !scan.images.length) S.ui.tab = 'cook';
  try { const q = new URLSearchParams(location.search).get('admin'); if (q && q === CONFIG.ADMIN_CODE) { S.settings.admin = true; persist(); } } catch (e) { }
  if (!S.settings.admin && ['catalog'].includes(S.ui.tab)) S.ui.tab = 'more';
  setupPWA();
  renderOnboard(); render();
  if (backend()) checkHealth(true); else probeSameOrigin();
}
boot();

</script>
