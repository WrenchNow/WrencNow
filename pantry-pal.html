<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E6A4E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111613" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pantry Pal">
<meta name="description" content="Scan receipts and your fridge, track what you have, and get recipes you can cook right now.">
<title>Pantry Pal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6EF;--surface:#FFFFFF;--surface-2:#F2ECE1;--ink:#1E2721;--muted:#687068;--line:#E6DED0;
  --brand:#2E6A4E;--brand-2:#3F8562;--brand-ink:#FFFFFF;--brand-soft:#E3EFE7;
  --accent:#D9572F;--accent-soft:#FBE6DE;--warn:#9A6408;--warn-soft:#FBEFD3;
  --danger:#B23624;--danger-soft:#F8E0DA;--ok:#2E7D4F;
  --shadow:0 1px 2px rgba(30,39,33,.06),0 6px 20px rgba(30,39,33,.07);
  --radius:18px;--radius-sm:12px;
  --font-d:'Fraunces',Georgia,'Times New Roman',serif;--font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --art-s:58%;--art-l:87%;--nav-h:66px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111613;--surface:#19201B;--surface-2:#222B25;--ink:#ECEFEA;--muted:#9BA49C;--line:#2D3731;
  --brand:#67BC8F;--brand-2:#80CBA2;--brand-ink:#0D1510;--brand-soft:#1E3327;
  --accent:#F08A64;--accent-soft:#3B241B;--warn:#E8B655;--warn-soft:#3A2F15;
  --danger:#F28472;--danger-soft:#3E201B;--ok:#71CC97;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.28);--art-s:32%;--art-l:24%;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
h1,h2,h3{font-family:var(--font-d);font-weight:700;letter-spacing:-.01em;margin:0}
h1{font-size:30px;line-height:1.1}
h2{font-size:20px;line-height:1.2}
h3{font-size:17px;line-height:1.25}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}

#app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 28px)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:2px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-width:42px;height:42px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 16px;font-weight:600;font-size:15px;min-height:48px;text-decoration:none;transition:transform .08s ease,filter .15s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-accent{background:var(--accent);color:#fff}
.btn-soft{background:var(--brand-soft);color:var(--brand)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-sm{min-height:36px;padding:7px 12px;border-radius:10px;font-size:14px}
.btn-block{width:100%}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.grow{flex:1}

/* segmented + chips */
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500;white-space:nowrap;min-height:36px}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip.danger.on{background:var(--danger);border-color:var(--danger);color:#fff}
.chip .x{margin-left:6px;opacity:.7}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label,.label{font-size:13px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px;min-height:46px;outline:none}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.input{min-height:110px;resize:vertical;line-height:1.45}
.search{position:relative}
.search .input{padding-left:40px}
.search::before{content:'⌕';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.stepper button{border:0;background:transparent;width:42px;height:42px;font-size:20px;font-weight:600;color:var(--brand)}
.stepper span{min-width:44px;text-align:center;font-weight:700}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.toggle{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s;cursor:pointer}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.toggle:checked{background:var(--brand)}
.toggle:checked::after{transform:translateX(20px)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.panel h2{margin-bottom:10px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px}
.section-h h2{font-size:19px}
.count{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 7px;border-radius:999px;background:var(--surface-2);font:600 12px var(--font);color:var(--muted);margin-left:6px;vertical-align:middle}
.note{background:var(--surface-2);border-radius:var(--radius-sm);padding:12px 14px;font-size:14px;color:var(--muted)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.danger{background:var(--danger-soft);color:var(--danger)}
.note.ok{background:var(--brand-soft);color:var(--brand)}
.disclosure{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.4}

/* filters */
details.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px}
details.filters summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-weight:600;cursor:pointer}
details.filters summary::-webkit-details-marker{display:none}
details.filters summary::after{content:'▾';color:var(--muted);transition:transform .2s}
details.filters[open] summary::after{transform:rotate(180deg)}
.filters-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.filters-body .label{margin-bottom:6px;display:block}

/* recipe cards */
.feed{display:flex;flex-direction:column;gap:12px}
.card{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%}
.card:active{transform:scale(.995)}
.art{flex:none;width:84px;height:84px;border-radius:14px;display:grid;place-items:center;font-size:40px;background:hsl(var(--h,120) var(--art-s) var(--art-l))}
.art.lg{width:100%;height:150px;font-size:72px;border-radius:var(--radius)}
.card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.card-body h3{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{font-size:13px;color:var(--muted)}
.macros{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.macro{font-size:12px;font-weight:600;background:var(--surface-2);border-radius:8px;padding:3px 7px;white-space:nowrap}
.missing{font-size:13px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:6px;padding:2px 6px;background:var(--brand-soft);color:var(--brand);margin-right:4px;vertical-align:middle}
.tag.ai{background:var(--accent-soft);color:var(--accent)}
.group-h{display:flex;align-items:center;gap:8px;margin:24px 0 10px}
.group-h .dot{width:10px;height:10px;border-radius:50%}
.more-btn{width:100%;margin-top:4px}

/* inventory */
.inv-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.inv-group h3{font-family:var(--font);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 16px 6px}
.item{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer;min-height:52px}
.inv-group h3 + .item{border-top:0}
.item-main{flex:1;min-width:0}
.item-name{font-weight:600;text-transform:capitalize}
.item-sub{font-size:13px;color:var(--muted)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.badge{font-size:12px;font-weight:600;border-radius:8px;padding:2px 7px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--brand-soft);color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px}
.stat b{display:block;font-family:var(--font-d);font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}

/* scan */
.scan-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.scan-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--line);background:var(--surface);border-radius:var(--radius);padding:22px 10px;font-weight:600;min-height:120px}
.scan-btn .ic{font-size:34px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px}
.review-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px}
.review-item.off{opacity:.45}
.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.review-grid .input{min-height:40px;padding:8px 10px;font-size:15px}
.review-top{display:flex;gap:10px;align-items:center}
.review-top input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand);flex:none}
.review-top .input{font-weight:600}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 10px;text-align:center;color:var(--muted)}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:spin .8s linear infinite}
.spinner.sm{width:18px;height:18px;border-width:2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);min-height:54px;width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.li:first-child{border-top:0}
.li .ic{font-size:22px;width:28px;text-align:center}
.li .chev{color:var(--muted);font-size:18px}
.li input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand);flex:none}
.li.done .li-title{text-decoration:line-through;color:var(--muted)}
.li-title{font-weight:600}

/* recipe detail */
.detail-head{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.ing-list{list-style:none;margin:0;padding:0}
.ing{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ing:last-child{border-bottom:0}
.ing .st{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.ing.have .st{background:var(--brand-soft);color:var(--brand)}
.ing.miss .st{background:var(--accent-soft);color:var(--accent)}
.ing .amt{font-weight:700;white-space:nowrap}
.ing .nm{flex:1;min-width:0}
.ing.basic .st{background:var(--surface-2);color:var(--muted)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 16px 42px;line-height:1.55}
.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:14px}
.cart-row{border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;background:var(--surface)}
.cart-row.off{opacity:.5}
.cart-row .row{align-items:flex-start}
.prod-opts{display:grid;gap:8px;margin-top:10px}
.prod{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--surface);text-align:left;width:100%}
.prod.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.prod img{width:48px;height:48px;object-fit:contain;border-radius:8px;background:#fff;flex:none}
.prod .pt{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.tab .ti{font-size:21px;line-height:1}
.tab.on{color:var(--brand)}
.tab.fab .ti{width:52px;height:52px;border-radius:18px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:24px;margin-top:-22px;box-shadow:0 6px 16px rgba(46,106,78,.35)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;pointer-events:none}
.sheet-backdrop{position:absolute;inset:0;background:rgba(10,14,12,.45);opacity:0;transition:opacity .2s}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92vh;background:var(--bg);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden}
.sheet.open{pointer-events:auto}
.sheet.open .sheet-backdrop{opacity:1}
.sheet.open .sheet-panel{transform:none}
.sheet-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px 18px;flex:none}
.sheet-grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
#sheet-body{overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet-foot{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 22%);padding:18px 0 4px;margin-top:6px}

/* onboarding */
#onboard{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto}
.ob{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px)}
.ob-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:20px 0}
.ob-hero{font-size:84px;line-height:1;text-align:center}
.ob h1{font-size:34px;text-align:center}
.ob .lead{text-align:center;color:var(--muted);font-size:17px}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .2s}
.dots i.on{width:22px;background:var(--brand)}
.tut{display:flex;flex-direction:column;gap:10px}
.tut-step{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.tut-step .n{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--brand-soft)}
.tut-step b{display:block}

#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .2s;z-index:90;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty .big{font-size:48px;margin-bottom:8px}
.empty h3{color:var(--ink);margin-bottom:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:600px){.art{width:96px;height:96px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}
.sheet-foot.static{position:static;background:none;padding-top:8px}
.ing.swap .st{background:var(--brand-soft);color:var(--brand)}

</style>
</head>
<body>
<div id="app"><main id="view" aria-live="polite"></main></div>

<nav class="tabs" aria-label="Main">
  <div class="tabs-in">
    <button class="tab" data-act="goto" data-tab="cook"><span class="ti">🍳</span>Cook</button>
    <button class="tab" data-act="goto" data-tab="pantry"><span class="ti">🧺</span>Pantry</button>
    <button class="tab fab" data-act="goto" data-tab="scan" aria-label="Scan"><span class="ti">📸</span>Scan</button>
    <button class="tab" data-act="goto" data-tab="shop" style="position:relative"><span class="ti">🛒</span>Shop<span id="shop-badge" hidden style="position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:18px"></span></button>
    <button class="tab" data-act="goto" data-tab="more"><span class="ti">☰</span>More</button>
  </div>
</nav>

<div id="sheet" class="sheet" aria-hidden="true">
  <div class="sheet-backdrop" data-act="closeSheet"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Details">
    <div class="sheet-grab"></div>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="onboard" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="gal" accept="image/*" multiple hidden>
<input type="file" id="import" accept="application/json,.json" hidden>

<script>
/* ================= DATA: recipe library + staples catalog ================= */
const UNITS = ['cup','tbsp','tsp','lb','oz','g','kg','ml','l','clove','can','whole','slice','pinch','bunch','stalk','head','sheet','leaf','pkg','sprig','jar','ear'];

function parseQty(s){
  s = String(s).trim();
  if (/^\d+\/\d+$/.test(s)) { const [a,b] = s.split('/').map(Number); return a/b; }
  const n = parseFloat(s); return isFinite(n) ? n : 1;
}
function parseIng(s){
  s = String(s || '').trim(); if (!s) return null;
  const parts = s.split(/\s+/);
  let qty = 1, i = 0;
  if (/^[\d.\/]+$/.test(parts[0])) { qty = parseQty(parts[0]); i = 1; }
  let unit = '';
  if (parts[i] && UNITS.includes(parts[i].toLowerCase())) { unit = parts[i].toLowerCase(); i++; }
  const name = parts.slice(i).join(' ').trim();
  if (!name) return null;
  return { qty, unit: unit === 'whole' ? '' : unit, name };
}

const LIB = [];
function R(title, cuisine, meal, time, servings, kcal, protein, carbs, ings, steps){
  LIB.push({
    id: 'lib-' + (LIB.length + 1), title, cuisine, meal, time, servings,
    nutrition: { kcal, protein, carbs },
    ingredients: ings.split(';').map(parseIng).filter(Boolean),
    steps: steps.split('|').map(s => s.trim()).filter(Boolean),
    source: 'library'
  });
}

/* ---- Shipped Amazon product picks for staples (owned by the amazon agent) ----
   Keys must match a STAPLES name exactly. Never invent ASINs: leave an item out until Wyatt has looked it up.
   Per-item fields:
     asin     10-character Amazon ASIN, from Wyatt's phone lookup or the Creators API only
     per      items per pack for countable items (eggs 12, tortillas 10). 0 = use the STAPLES pack count / buy 1
     size     human note, e.g. '16.9 fl oz' (catalog screen only)
     verified true only after Wyatt confirms the product page matches. The one-tap cart ignores unverified ASINs
              and uses a tagged search link instead.
     checked  ISO date Wyatt last confirmed it (re-check about every 6 months)
     src      'wyatt-phone' or 'creators-api'
   Example: 'olive oil': { asin: '', per: 0, size: '', verified: false, checked: '', src: '' },
   Bump STAPLE_ASINS_VERSION on every change so existing users get the new picks merged into their saved catalog. */
const STAPLE_ASINS_VERSION = 1;
const STAPLE_ASINS = {};

function buildDefaultCatalog(){
  const out = [];
  for (const [cat, list] of Object.entries(STAPLES)) {
    for (const raw of list.split(',')) {
      const [name, per] = raw.trim().split('|');
      if (!name) continue;
      const a = STAPLE_ASINS[name] || {};
      out.push({ id: 'c' + out.length, name, cat, per: a.per > 0 ? Number(a.per) : per ? Number(per) : 0, asin: a.asin || '', title: '', term: name,
        size: a.size || '', verified: a.verified === true, checked: a.checked || '', src: a.src || '', asinSrc: a.asin ? 'shipped' : '' });
    }
  }
  return out;
}

function bheaders(json = true) { const h = {}; if (json) h['Content-Type'] = 'application/json'; if (S.settings.appToken) h['X-App-Token'] = S.settings.appToken; return h; }
function aiError(msg, code) { const e = new Error(msg); e.code = code; return e; }
async function callClaude({ system, content, maxTokens = 2000 }) {
  const key = (S.settings.userKey || '').trim();
  if (key) {
    // Bring-your-own-key: the request goes straight from this device to Anthropic. The key never touches our server.
    const body = { model: CONFIG.MODEL, max_tokens: maxTokens, messages: [{ role: 'user', content }] }; if (system) body.system = system;
    let res;
    try {
      res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, body: JSON.stringify(body) });
    } catch (e) { throw aiError('Couldn’t reach Anthropic. Check your connection.', 'network'); }
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) throw aiError('Your API key was rejected. Check it in Settings → AI.', 'key');
    if (!res.ok) throw aiError(data?.error?.message || ('AI request failed (' + res.status + ')'), 'api');
    return (data.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n');
  }
  const b = backend();
  if (b) {
    const res = await fetch(b + '/api/claude', { method: 'POST', headers: bheaders(), body: JSON.stringify({ system, max_tokens: maxTokens, messages: [{ role: 'user', content }] }) });
    const data = await res.json().catch(() => ({}));
    if (res.status === 429 && data.code === 'free_limit') throw aiError(data.error || 'You’ve used today’s free AI requests. Add your own key in Settings for unlimited use, or try again tomorrow.', 'free_limit');
    if (!res.ok) throw aiError(data?.error?.message || data?.error || ('AI request failed (' + res.status + ')'), 'api');
    return (data.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n');
  }
  if (hasClaudeBuiltin()) {
    if (content.some(c => c.type === 'image')) throw aiError('Photo scanning needs an AI key. Add yours in Settings → AI.', 'none');
    const text = content.filter(c => c.type === 'text').map(c => c.text).join('\n\n');
    return await window.claude.complete((system ? system + '\n\n' : '') + text);
  }
  throw aiError('AI isn’t set up yet. Add your own Anthropic key in Settings → AI to turn on scanning and custom recipes.', 'none');
}
function extractJSON(text) {
  text = String(text || '').replace(/```(?:json)?/g, '');
  try { return JSON.parse(text); } catch (e) { }
  const o = text.indexOf('{'), a = text.indexOf('[');
  const start = (o === -1) ? a : (a === -1 ? o : Math.min(o, a));
  if (start === -1) throw new Error('The AI response wasn’t readable. Try again.');
  const close = text[start] === '{' ? '}' : ']';
  const end = text.lastIndexOf(close);
  try { return JSON.parse(text.slice(start, end + 1)); } catch (e) { throw new Error('The AI response wasn’t readable. Try again.'); }
}
function constraintsText() {
  const { keys, custom } = allergyIndex();
  const al = [...[...keys.keys()].map(k => ALLERGENS.find(a => a.k === k).label), ...custom.map(c => c.term)];
  const diets = S.settings.applyDiets ? householdDiets() : [];
  return `ALLERGIES (strict — never include these or ingredients containing them): ${al.length ? al.join(', ') : 'none'}.
DIET (every recipe must fit all of these): ${diets.length ? diets.join(', ') : 'none'}.`;
}

/* ---------- image handling ---------- */
async function fileToJpeg(file, max = 1568) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Couldn’t read that image.')); i.src = url; });
    let w = img.naturalWidth, h = img.naturalHeight; const s = Math.min(1, max / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s);
    const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
    return c.toDataURL('image/jpeg', 0.85);
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- Amazon ---------- */
const AMZ = 'https://www.amazon.com';
// Words that describe a part or form of a food, so 'lemon juice' can still buy lemons and 'garlic cloves' garlic.
const FORM_WORDS = new Set(['juice', 'zest', 'clove', 'seed', 'wedge', 'slice', 'strip', 'yolk', 'leaf', 'sprig', 'stalk', 'floret', 'piece', 'chunk', 'half']);
// Like norm() but keeps descriptive words ('diced', 'baby') so those staples can be told apart.
const looseKey = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\(.*?\)/g, ' ').replace(/[^a-z\s-]/g, ' ').split(/[\s-]+/).filter(Boolean).map(singular).join(' ');
// Picks the most specific staple. Unlike nameMatch (used for "have it"), a different head noun is only
// accepted for form words, so 'butter lettuce' doesn't buy butter and 'potato gnocchi' doesn't buy potatoes.
function catalogFind(name) {
  const n = norm(name); if (!n) return null;
  const k = looseKey(name), exact = S.catalog.find(c => looseKey(c.name) === k); if (exact) return exact;
  const A = n.split(' '); let best = null, bestScore = -Infinity;
  for (const c of S.catalog) {
    const cn = norm(c.name); if (cn !== n && !nameMatch(name, c.name)) continue;
    const B = cn.split(' '), diff = [...A.filter(w => !B.includes(w)), ...B.filter(w => !A.includes(w))];
    const sameHead = A[A.length - 1] === B[B.length - 1];
    if (!sameHead && !diff.every(w => FORM_WORDS.has(w))) continue;
    const score = (cn === n ? 100 : 0) + (sameHead ? 10 : 0) - diff.length;
    if (score > bestScore) { best = c; bestScore = score; }
  }
  return best;
}
function packQty(ing, q, cat) {
  if (ing.unit) return 1;
  if (cat && cat.per > 1) return clamp(Math.ceil(q / cat.per), 1, 10);
  if (!cat || cat.cat === 'Produce') return clamp(Math.ceil(q), 1, 10);
  return 1;
}
function tagParam() { return (S.settings.tag || CONFIG.AMAZON_TAG || '').trim(); }
function searchUrl(term) { const p = new URLSearchParams({ k: term, i: 'grocery' }); if (tagParam()) p.set('tag', tagParam()); return AMZ + '/s?' + p.toString(); }
function cartUrl(items) {
  const p = new URLSearchParams(); if (tagParam()) p.set('AssociateTag', tagParam());
  items.forEach((it, i) => { p.set('ASIN.' + (i + 1), it.asin); p.set('Quantity.' + (i + 1), String(it.qty)); });
  return AMZ + '/gp/aws/cart/add.html?' + p.toString();
}
function draftItem(ing, factor) {
  const q = ing.qty * factor; const cat = catalogFind(ing.name);
  return { key: uid(), name: ing.name, unit: ing.unit, amount: q, need: fmtAmount(q, ing.unit), asin: cartAsin(cat), title: cartAsin(cat) ? (cat.title || cat.name) : '', term: cat?.term || ing.name, category: cat?.cat || 'Other', qty: packQty(ing, q, cat), on: true, options: null, loading: false, err: '' };
}
function pickerAvailable() { return !!(backend() && S.settings.picker && health?.amazon !== false); }
async function loadOptions(it) {
  if (it.loading || it.options) return;
  it.loading = true; it.err = ''; drawSheet();
  try {
    const res = await fetch(backend() + '/api/amazon/search?q=' + encodeURIComponent(it.term), { headers: bheaders(false) });
    const data = await res.json().catch(() => ({}));
    if (res.status === 501) { health = Object.assign(health || {}, { amazon: false }); throw new Error('Product picker isn’t set up on your backend yet — using Amazon search instead.'); }
    if (!res.ok) throw new Error(data.error || 'Product search failed.');
    it.options = (data.items || []).slice(0, 3);
    if (!it.options.length) it.err = 'No products found — Amazon search will be used.';
  } catch (e) { it.err = e.message; }
  it.loading = false; drawSheet();
}
function rememberPick(it, opt) {
  it.asin = opt.asin; it.title = opt.title || it.name; it.image = opt.image || '';
  let c = catalogFind(it.name);
  if (!c) { c = { id: 'c' + uid(), name: it.name.toLowerCase(), cat: it.category || 'Other', per: 0, asin: '', title: '', term: it.term }; S.catalog.push(c); }
  c.asin = opt.asin; c.title = ''; c.asinSrc = 'user'; persist(); // store the ASIN only, not API titles or prices
}
function recordPending(items) {
  for (const it of items) {
    if (S.cart.some(c => norm(c.name) === norm(it.name))) continue;
    S.cart.push({ id: uid(), name: it.name, qty: it.unit ? 1 : Math.max(1, Math.ceil(it.amount || 1)), unit: '', category: it.category || guessCategory(it.name), added: todayISO() });
  }
  persist();
}

function expiryBadge(iso) {
  const d = daysUntil(iso); if (d == null) return '';
  if (d < 0) return `<span class="badge danger">Expired ${-d}d ago</span>`;
  if (d === 0) return `<span class="badge danger">Use today</span>`;
  if (d === 1) return `<span class="badge warn">Use tomorrow</span>`;
  if (d <= 3) return `<span class="badge warn">${d} days left</span>`;
  if (d <= 7) return `<span class="badge">${d} days</span>`;
  return `<span class="badge">${fmtDate(iso)}</span>`;
}
function viewPantry() {

  const exp = inv.filter(i => { const d = daysUntil(i.expires); return d != null && d >= 0 && d <= 3; });

  if (filter === 'soon') list = inv.filter(i => { const d = daysUntil(i.expires); return d != null && d <= 3; });

  const groups = CATEGORIES.map(c => [c, list.filter(i => (CATEGORIES.includes(i.category) ? i.category : 'Other') === c).sort((a, b) => (a.expires || '9').localeCompare(b.expires || '9'))]).filter(([, l]) => l.length);

/* ---- scan ---- */
function viewScan() {
  const types = [['receipt', '🧾', 'Receipt'], ['fridge', '🧊', 'Fridge'], ['pantry', '🥫', 'Pantry'], ['freezer', '❄️', 'Freezer']];
  const head = `<header class="top"><div><p class="eyebrow">AI scanner</p><h1>Scan</h1></div></header>`;
  if (scan.busy) return head + `<div class="loading"><div class="spinner"></div><b>Reading your ${scan.type}…</b><p class="small">This usually takes 10–20 seconds.</p></div>`;
  if (scan.items) {
    const on = scan.items.filter(i => i.on).length;
    return head + `<div class="row" style="justify-content:space-between;margin-bottom:12px"><h2>Review ${scan.items.length} item${scan.items.length === 1 ? '' : 's'}</h2><button class="btn btn-ghost btn-sm" data-act="scanToggleAll">${on === scan.items.length ? 'Uncheck all' : 'Check all'}</button></div>
      <p class="small muted" style="margin-bottom:12px">Fix anything the AI got wrong, uncheck what you don’t want, then add.</p>
      ${hasAllergies() ? allergyNote('margin:-6px 0 12px') : ''}
      ${scan.items.map((it, i) => `<div class="review-item ${it.on ? '' : 'off'}">
        <div class="review-top"><input type="checkbox" ${it.on ? 'checked' : ''} data-scan="${i}" data-f="on" aria-label="Include"><input class="input" data-scan="${i}" data-f="name" value="${esc(it.name)}" aria-label="Name"></div>
        <div class="review-grid">
          <input class="input" type="number" inputmode="decimal" step="any" data-scan="${i}" data-f="qty" value="${esc(it.qty)}" aria-label="Quantity">
          <input class="input" data-scan="${i}" data-f="unit" value="${esc(it.unit)}" placeholder="unit" aria-label="Unit">
          <select class="input" data-scan="${i}" data-f="category" aria-label="Category">${CATEGORIES.map(c => `<option ${c === it.category ? 'selected' : ''}>${c}</option>`).join('')}</select>
          <label class="row small muted" style="gap:6px"><input class="input" type="number" inputmode="numeric" data-scan="${i}" data-f="days" value="${esc(it.days)}" aria-label="Days until expiry" style="width:70px">days</label>
        </div>${it.note ? `<p class="tiny muted" style="margin-top:6px">${esc(it.note)}</p>` : ''}
        ${conflictsFor([it.name]).map(c => `<p class="tiny" style="color:var(--danger);margin-top:6px">⚠ ${esc(c.label)} — ${esc(c.who.join(', '))}</p>`).join('')}
      </div>`).join('')}
      <div class="sheet-foot" style="position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:8px"><div class="stack">
        <button class="btn btn-primary btn-block" data-act="scanAdd">Add ${on} item${on === 1 ? '' : 's'} to pantry</button>
        <button class="btn btn-ghost btn-block" data-act="scanDiscard">Discard</button></div></div>`;
  }
  return head + `<div class="seg">${types.map(([k, ic, l]) => `<button class="${scan.type === k ? 'on' : ''}" data-act="scanType" data-v="${k}">${ic} ${l}</button>`).join('')}</div>
    <div class="scan-btns">
      <button class="scan-btn" data-act="pickCam"><span class="ic">📷</span>Take photo</button>
      <button class="scan-btn" data-act="pickGal"><span class="ic">🖼️</span>Choose from gallery</button></div>
    ${scan.images.length ? `<div class="thumbs">${scan.images.map((src, i) => `<div class="thumb"><img src="${src}" alt="Photo ${i + 1}"><button data-act="rmImg" data-i="${i}" aria-label="Remove">✕</button></div>`).join('')}</div>
      <button class="btn btn-primary btn-block" data-act="analyze">Analyze ${scan.images.length} photo${scan.images.length === 1 ? '' : 's'}</button>` : `<p class="small muted" style="text-align:center">${scan.type === 'receipt' ? 'Flatten the receipt and get every line in frame. Long receipts? Add a few photos.' : 'Open the door wide, use good light, and take one photo per shelf if it’s crowded.'}</p>`}
    ${scan.error ? `<div style="margin-top:14px">${aiErrorHtml(scan.error, scan.errorCode)}</div>` : ''}
    ${!canSeeImages() ? `<div class="note warn" style="margin-top:14px">Photo scanning needs AI. Add your own Anthropic key to turn it on — or add items by hand in Pantry. <button class="btn btn-sm btn-soft" data-act="goto" data-tab="settings" style="margin-top:8px">Add my key</button></div>` : ''}`;
}

async function loadSteps(r) {
  if (r.steps || r._loading) return;
  r._loading = true; r._stepsErr = ''; drawSheet();
  try {
    const text = await callClaude({
      system: 'You are a precise recipe writer. Respond with JSON only.',
      content: [{ type: 'text', text: `Write clear cooking steps for this recipe. Include temperatures, times and doneness cues. 4–9 steps. Do not include links or references to websites.
Recipe: ${JSON.stringify({ title: r.title, servings: r.servings, ingredients: r.ingredients.map(i => [i.qty, i.unit, i.name].filter(Boolean).join(' ')) })}
Return: {"steps":["..."]}` }], maxTokens: 1500
    });
    const data = extractJSON(text); const steps = (data.steps || data).filter(s => typeof s === 'string' && s.trim());
    if (!steps.length) throw new Error('No steps came back. Try again.');
    r.steps = steps.map(s => s.replace(/^\s*\d+[.)]\s*/, '').trim()); persist();
  } catch (e) { r._stepsErr = e.message; }
  r._loading = false; if (sheet && detail && detail.id === r.id) drawSheet();
}

  try {
    const res = await fetch(b + '/api/health', { headers: bheaders(false) });
    const data = await res.json().catch(() => ({}));
    health = res.ok ? Object.assign({ ok: true }, data) : { ok: false, error: String(data.error || ('Backend returned ' + res.status)) };

FILTERS: cuisine ${f.cuisines.length ? f.cuisines.join(' or ') : 'any'}; meal ${f.meal === 'Any' ? 'any' : f.meal}; max total time ${f.maxTime ? f.maxTime + ' minutes' : 'any'}; nutrition goal ${GOALS.find(g => g.k === f.goal)?.label || 'any'}${f.cookWith ? `; must use: ${f.cookWith}` : ''}.
AVOID REPEATS: Don't recreate any of these: ${[...S.aiRecipes.slice(0, 20).map(r => r.title), ...S.cooked.slice(-10).map(c => c.title)].join('; ') || 'none'}.
RULES: Prefer pantry items, especially ones marked [use soon]. Make at least ${seed ? 1 : 3} recipes that need nothing beyond the pantry plus salt, pepper, water and oil; the others may need 1–2 extra items. Ingredient names must be plain grocery names (e.g. "chicken breast", "olive oil"). Units must be one of: cup, tbsp, tsp, lb, oz, g, kg, ml, l, clove, can, slice, pinch, bunch, or empty for whole items. Nutrition is per serving. Cuisine must be one of: ${CUISINES.join(', ')}. Meal must be one of: Breakfast, Lunch, Dinner, Side, Snack, Dessert. No links or references to websites.
Return JSON only: {"recipes":[{"title":"","cuisine":"","meal":"","time_minutes":0,"servings":${party},"calories":0,"protein_g":0,"carbs_g":0,"summary":"one appetizing sentence","ingredients":[{"qty":1,"unit":"","name":""}]}]}`;
    const text = await callClaude({ system: 'You are a creative, practical home chef. You strictly respect allergies and diets. Respond with JSON only.', content: [{ type: 'text', text: prompt }], maxTokens: 4000 });
    const data = extractJSON(text);
    const list = (Array.isArray(data) ? data : data.recipes || []).map(x => normalizeAiRecipe(x, party)).filter(Boolean);
    if (!list.length) throw new Error('The AI didn’t return any recipes. Try again.');
    S.aiRecipes = [...list, ...S.aiRecipes].slice(0, 40); persist();
    const hidden = list.filter(r => conflictsFor(r.ingredients.map(i => i.name)).length).length;
    toast(`${auto ? '✨ ' : ''}${list.length} new recipe${list.length === 1 ? "" : "s"}${auto ? ' from your scan' : ''}${hidden && S.settings.hideAllergens ? ` (${hidden} hidden for allergens)` : ''}`);
  } catch (e) { feed.error = e.message; feed.errorCode = e.code || ''; if (seed) toast(e.message); }
  feed.busy = false; if (S.ui.tab === 'cook') render(); drawSheet();
}

async function analyzeScan() {
  if (!scan.images.length || scan.busy) return;
  scan.busy = true; scan.error = ''; scan.errorCode = ''; render();
  try {
    const t = scan.type;
    const what = t === 'receipt' ? 'grocery receipt' : `photo of the inside of a ${t}`;
    const instr = t === 'receipt'
      ? 'Extract every food or drink item purchased. Expand store abbreviations into plain names (e.g. "ORG BNLS CHKN BRST" → "chicken breast"). Use the quantity and weight printed on the receipt. Skip non-food items, bags, taxes, totals, coupons and discounts.'
      : `List every distinct food item you can see. Estimate quantities from what is visible. Items in a ${t} may have been there a while, so estimate use-by conservatively, and mention in "note" anything that looks spoiled or nearly empty.`;
    const content = [
      ...scan.images.map(src => ({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: src.split(',')[1] } })),
      { type: 'text', text: `These ${scan.images.length > 1 ? scan.images.length + ' images show one' : 'image shows a'} ${what}. ${instr}
Return JSON only: {"items":[{"name":"plain lowercase grocery name","quantity":1,"unit":"lb, oz, g, gal, qt, l, ml, can, bottle, bag, box, jar, bunch, or empty for a count","category":"one of: ${CATEGORIES.join(', ')}","expires_in_days":7,"note":""}]}
If there is no food, return {"items":[]}.` }
    ];
    const text = await callClaude({ system: 'You are a meticulous grocery inventory assistant. Respond with JSON only.', content, maxTokens: 3000 });
    const data = extractJSON(text);
    const items = (Array.isArray(data) ? data : data.items || []).map(x => {
      const name = String(x.name || '').trim(); if (!name) return null;
      const category = CATEGORIES.includes(x.category) ? x.category : guessCategory(name);
      let unit = String(x.unit || '').toLowerCase().trim(); if (['count', 'each', 'ea', 'whole', 'item', 'pc'].includes(unit)) unit = '';
      return { on: true, name, qty: Number(x.quantity ?? x.qty) || 1, unit, category, days: Number.isFinite(Number(x.expires_in_days)) ? Math.round(Number(x.expires_in_days)) : SHELF[category], note: String(x.note || '').slice(0, 140) };
    }).filter(Boolean);
    if (!items.length) throw new Error(t === 'receipt' ? 'No food items found on that receipt. Try a clearer, flatter photo.' : 'No food found in that photo. Try better light or a closer shot.');
    scan.items = items;
  } catch (e) { scan.error = e.message; scan.errorCode = e.code || ''; }
  scan.busy = false; if (S.ui.tab === 'scan') render(); else if (scan.items) toast('Scan ready to review');
}
async function addFiles(files) {
  const list = [...(files || [])].filter(f => f.type.startsWith('image/') || /\.(heic|heif)$/i.test(f.name)).slice(0, 6 - scan.images.length);
  if (!list.length) { if ((files || []).length) toast('Up to 6 photos per scan'); return; }
  scan.error = '';
  for (const f of list) { try { scan.images.push(await fileToJpeg(f)); } catch (e) { scan.error = e.message; } }
  render();
}
function itemsFromMissing(r, servings, only) {
  const factor = servings / r.servings;
  return (only || splitMissing(r).missing).filter(i => !isBasic(i.name)).map(i => draftItem(i, factor));
}

  if (ds.draft && itemDraft) {

    const f = el.files[0]; el.value = ''; if (!f) return;
    f.text().then(t => { const data = JSON.parse(t); if (!data || !Array.isArray(data.inventory)) throw new Error(); const { userKey, admin, backendUrl, appToken, tag } = S.settings; const keep = { userKey, admin, backendUrl, appToken, tag }; S = hydrate(sanitizeBackup(data)); Object.assign(S.settings, keep); persist(); render(); toast('Backup restored'); }).catch(() => toast('That file isn’t a Pantry Pal backup'));
  }
});
document.addEventListener('toggle', e => { const el = e.target; if (el.dataset && el.dataset.details) { S.ui[el.dataset.details] = el.open; persist(); } }, true);
document.addEventListener('submit', e => {
  const form = e.target.closest('[data-form]'); if (!form) return; e.preventDefault();
  const kind = form.dataset.form; const inp = form.querySelector('input'); const v = inp.value.trim(); if (!v) return;
  if (kind === 'slAdd') { const p = parseIng(v); const hasNum = /^[\d.\/]/.test(v); S.shopping.push({ id: uid(), name: hasNum && p ? p.name : v, need: hasNum && p ? fmtAmount(p.qty, p.unit) : '', amount: hasNum && p ? p.qty : 1, unit: hasNum && p ? p.unit : '', done: false }); persist(); render(); $('[data-form="slAdd"] input')?.focus(); return; }
  if (kind === 'mCustom' && memberDraft) { if (!memberDraft.custom.some(t => norm(t) === norm(v))) memberDraft.custom.push(v.slice(0, 40)); drawSheet(); return; }
  if (kind === 'obCustom') { if (!ob.custom.some(t => norm(t) === norm(v))) ob.custom.push(v.slice(0, 40)); renderOnboard(); return; }
  if (kind === 'catAdd') { if (S.catalog.some(c => norm(c.name) === norm(v))) return toast('Already in the catalog'); S.catalog.unshift({ id: 'c' + uid(), name: v.toLowerCase(), cat: 'Other', per: 0, asin: '', title: '', term: v }); persist(); catQ = ''; render(); return; }
});

/* ================= BOOT ================= */
function setupPWA() {
  const icon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#2E6A4E"/><text x="256" y="330" font-size="280" text-anchor="middle">🥕</text></svg>`;
  const iconUrl = 'data:image/svg+xml,' + encodeURIComponent(icon);
  const manifest = { name: 'Pantry Pal', short_name: 'Pantry Pal', start_url: location.href.split('#')[0], display: 'standalone', background_color: '#FAF6EF', theme_color: '#2E6A4E', icons: [{ src: iconUrl, sizes: 'any', type: 'image/svg+xml', purpose: 'any maskable' }] };
  try {
    const link = document.createElement('link'); link.rel = 'manifest'; link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' })); document.head.appendChild(link);
    const ap = document.createElement('link'); ap.rel = 'apple-touch-icon'; ap.href = iconUrl; document.head.appendChild(ap);
  } catch (e) { }
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !hasClaudeBuiltin() && !window.storage) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* optional: add sw.js next to this file for offline support */ });
  }
}
async function boot() {
  Store.init();
  S = hydrate(await Store.load());
  if (S.ui.tab === 'scan' && !scan.images.length) S.ui.tab = 'cook';
  try { const q = new URLSearchParams(location.search).get('admin'); if (q && q === CONFIG.ADMIN_CODE) { S.settings.admin = true; persist(); } } catch (e) { }
  if (!S.settings.admin && ['catalog'].includes(S.ui.tab)) S.ui.tab = 'more';
  setupPWA();
  renderOnboard(); render();
  if (backend()) checkHealth(true);
}
boot();

</script>
