# Netlify auto-detects Next.js and applies its Next.js runtime (OpenNext adapter).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Secrets (Supabase service role, Stripe, Checkr) go in Site settings → Environment variables,
# never in this file. See .env.example for the full list.
