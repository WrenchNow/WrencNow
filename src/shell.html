<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E6A4E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111613" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pantry Pal">
<meta name="description" content="Scan receipts and your fridge, track what you have, and get recipes you can cook right now.">
<title>Pantry Pal</title>
<link rel="icon" type="image/svg+xml" href="/*ICON_SVG*/">
<link rel="apple-touch-icon" href="/*ICON_PNG*/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*CSS*/
</style>
</head>
<body>
<div id="app"><main id="view" aria-live="polite"></main></div>

<nav class="tabs" aria-label="Main">
  <div class="tabs-in">
    <button class="tab" data-act="goto" data-tab="cook"><span class="ti">🍳</span>Cook</button>
    <button class="tab" data-act="goto" data-tab="pantry"><span class="ti">🧺</span>Pantry</button>
    <button class="tab fab" data-act="goto" data-tab="scan" aria-label="Scan"><span class="ti">📸</span>Scan</button>
    <button class="tab" data-act="goto" data-tab="shop" style="position:relative"><span class="ti">🛒</span>Shop<span id="shop-badge" hidden style="position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;line-height:18px"></span></button>
    <button class="tab" data-act="goto" data-tab="more"><span class="ti">☰</span>More</button>
  </div>
</nav>

<div id="sheet" class="sheet" aria-hidden="true">
  <div class="sheet-backdrop" data-act="closeSheet"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Details">
    <div class="sheet-grab"></div>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="onboard" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="gal" accept="image/*" multiple hidden>
<input type="file" id="import" accept="application/json,.json" hidden>

<script>
/*JS*/
</script>
</body>
</html>
